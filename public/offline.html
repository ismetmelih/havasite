<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script>(function(){try{var t=localStorage.getItem('havasite_theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Bağlantı yok — TürkiyeCanlı</title>
<meta name="theme-color" content="#0a1224" />
<link rel="icon" type="image/svg+xml" href="/img/logo.svg" />
<link rel="stylesheet" href="/css/base.css" />
<style>
  .off-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
    gap: 12px;
  }
  .off-wrap img { width: 96px; height: 96px; margin-bottom: 8px; }
  .off-wrap h1 { margin: 0; font-size: 1.5rem; }
  .off-wrap p { color: var(--text-secondary); max-width: 380px; margin: 0 0 12px; line-height: 1.6; }
</style>
</head>
<body>
<main class="off-wrap">
  <img class="icon-3d" src="/img/3d/cloud.png" alt="" />
  <h1>İnternet bağlantısı yok</h1>
  <p>Bu sayfa daha önce açılmadığı için çevrimdışı gösterilemiyor. Bağlantın gelince otomatik olarak yenilenecek.</p>
  <button class="btn btn-primary" type="button" onclick="location.reload()">Tekrar dene</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
