<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="TürkiyeCanlı logosu">
  <defs>
    <linearGradient id="lg-weather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2a78d6"/>
    </linearGradient>
    <linearGradient id="lg-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb15c"/>
      <stop offset="100%" stop-color="#eb6834"/>
    </linearGradient>
    <linearGradient id="lg-quake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b5c"/>
      <stop offset="100%" stop-color="#d03b3b"/>
    </linearGradient>
    <radialGradient id="lg-globe" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#16233a"/>
      <stop offset="100%" stop-color="#070a10"/>
    </radialGradient>
  </defs>

  <!-- dis halka: 3 kategori yayi -->
  <g fill="none" stroke-linecap="round">
    <circle cx="100" cy="100" r="88" stroke="url(#lg-weather)" stroke-width="13"
      stroke-dasharray="153.6 399.3" transform="rotate(-160 100 100)"/>
    <circle cx="100" cy="100" r="88" stroke="url(#lg-fire)" stroke-width="13"
      stroke-dasharray="153.6 399.3" transform="rotate(-40 100 100)"/>
    <circle cx="100" cy="100" r="88" stroke="url(#lg-quake)" stroke-width="13"
      stroke-dasharray="153.6 399.3" transform="rotate(80 100 100)"/>
  </g>

  <!-- ic kure (dunya / globe hissi) -->
  <circle cx="100" cy="100" r="66" fill="url(#lg-globe)"/>
  <g stroke="#3987e5" stroke-width="1" opacity="0.35" fill="none">
    <ellipse cx="100" cy="100" rx="66" ry="24"/>
    <ellipse cx="100" cy="100" rx="66" ry="46"/>
    <line x1="34" y1="100" x2="166" y2="100"/>
    <line x1="100" y1="34" x2="100" y2="166"/>
  </g>

  <!-- kategori mini simgeleri -->
  <g transform="translate(58 62)">
    <circle cx="0" cy="0" r="9" fill="#ffd166"/>
    <path d="M-14 12c0-7 6-12 13-12 1 0 2 0 3 .3 2-4 6-6.3 10-6.3 7 0 12 5.5 12 12.3 0 .6 0 1.2-.1 1.7 3 1 5.1 3.8 5.1 7 0 4-3.2 7-7.2 7H-9c-4.6 0-8.4-3.6-8.4-8 0-3.6 2.6-6.7 6.1-7.6Z" fill="#eef3fb"/>
  </g>
  <g transform="translate(143 66)">
    <path d="M0 -20c3 6-2 9-2 14 0 4 3 5 5 5 4 0 7-3 7-8 5 5 7 11 7 16 0 9-7 16-17 16s-17-7-17-16c0-7 4-12 7-16 1 5 4 7 7 7 2 0-2-3 3-18Z" fill="url(#lg-fire)"/>
  </g>
  <g transform="translate(100 152)" stroke="#ff8a80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M-34 0h10l4-9 5 16 6-22 5 15h10"/>
  </g>

  <!-- merkez konum ii-i -->
  <path d="M100 66c15 0 27 12 27 27 0 20-27 45-27 45s-27-25-27-45c0-15 12-27 27-27Z" fill="#f5f7fa"/>
  <circle cx="100" cy="93" r="10" fill="#0c1119"/>
  <circle cx="100" cy="93" r="5" fill="#38bdf8"/>
</svg>
